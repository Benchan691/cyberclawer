# Per-scraper HTTP retry/backoff and error-log settings.
# Precedence: explicit ScraperSettings / CLI > [scrapers.<provider>] > [scrapers.defaults].
#
# Catch-up provider selection (optional):
# - Omit this section to run every provider discovered in vuln_scraper/scrapers/.
# - Use providers = ["all"] to run every provider explicitly.
# - Or list only the scrapers you want; unknown keys are skipped with a warning.
#
# Providers are discovered from the vuln_scraper/scrapers/ package directories
# (each directory with a provider.py is a provider). This list may lag the
# registry: keys without a matching provider are skipped.

[scrapers.catch_up]
providers = [
  "avd",
  "cnvd",
  "cve",
  "fortiguard",
  "github_advisory",
  "govcert",
  "hkcert",
  "hpe",
  "huawei_sa",
  "juniper",
  "msrc",
  "nvd",
  "paloalto",
  "qianxin",
  "splunk",
  "zimbra",
]

[scrapers.defaults]
retries = 3
backoff_base = 1.0
backoff_max = 30.0
backoff_jitter = 0.4
error_log = "scraper-errors.log"

# Email alerts for scrape failures. When any URL fetch fails during a run, a
# CSS-styled HTML report is sent to these recipients. SMTP relay settings are
# read from the .env file below (SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_FROM,
# SMTP_USE_TLS, SMTP_USE_SSL); host/port/from/username/password/use_tls/use_ssl
# can also be set here to override. A failure already reported is only re-sent
# after repeat_hours has elapsed, so chronic failures do not email every run.
[scrapers.email]
enabled = true
to = ["ben.chan@citictel-cpc.com"]
cc = []
bcc = []
repeat_hours = 24
env_file = "/home/cpcnet/webserver-rust-zimbra-candidate/.env"

[scrapers.cnvd]
retries = 5
backoff_base = 2.0
session_max_retries = 50
session_retry_delay = 0.3

[scrapers.cve]
retries = 5
backoff_base = 2.0
