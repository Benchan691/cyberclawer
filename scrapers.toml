# Per-scraper HTTP retry/backoff and error-log settings.
# Precedence: explicit ScraperSettings / CLI > [scrapers.<provider>] > [scrapers.defaults].
#
# Catch-up provider selection (optional):
# - Omit this section to run every scraper.
# - Use providers = ["all"] to run every scraper explicitly.
# - Or list only the scrapers you want; remove lines you do not need.
#
# Available provider keys:
# avd, cisco, cnnvd, cnvd, cve, github_advisory, govcert, hikvision, hkcert,
# huawei_sa, infosec, juniper, msrc, paloalto, qianxin, ransomwarelive, splunk, zeroday, zimbra

[scrapers.catch_up]
providers = ["all"]

[scrapers.defaults]
retries = 3
backoff_base = 1.0
backoff_max = 30.0
backoff_jitter = 0.4
error_log = "scraper-errors.log"

[scrapers.cnvd]
retries = 5
backoff_base = 2.0
session_max_retries = 50
session_retry_delay = 0.3

[scrapers.cve]
retries = 5
backoff_base = 2.0
