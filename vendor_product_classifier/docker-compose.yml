services:
  classifier:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      CLASSIFIER_CONFIG: /app/config/classifier.json
      CLASSIFIER_LOG_LEVEL: ${CLASSIFIER_LOG_LEVEL:-INFO}
      CPE_DICTIONARY_PATH: ${CPE_DICTIONARY_PATH:-/app/fixtures/cpes.csv}
      SENTENCE_TRANSFORMERS_HOME: /app/models
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
    volumes:
      - ./config/classifier.json:/app/config/classifier.json:ro
      - ./fixtures:/app/fixtures:ro
      - ./models:/app/models
    command: ["python", "classifier_daemon.py"]
