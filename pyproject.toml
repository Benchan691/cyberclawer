[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-bulletin-scraper"
version = "0.1.0"
description = "Async terminal scrapers for vulnerability bulletin catalogs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "pymongo>=4.7.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44.0"]
avd = ["quickjs>=1.0.0", "requests>=2.31.0"]
cnvd = ["quickjs>=1.0.0", "ddddocr>=1.5.0", "requests>=2.31.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
vuln-scrape = "vuln_scraper.cli:main"
mongodb-filter = "vuln_scraper.tui:main"

[tool.setuptools.packages.find]
include = ["vuln_scraper*"]
